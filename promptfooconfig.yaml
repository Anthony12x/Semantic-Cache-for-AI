description: "Enterprise Semantic Cache Validation Suite (50 Pairs / 100 Prompts)"

prompts:
  - "{{prompt}}"

providers:
  - id: http
    config:
      url: "http://127.0.0.1:8000/api/v1/generate"
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        prompt: "{{prompt}}"
        model: "tinyllama"
        temperature: 0.0
      transformResponse: >
        json.cached ? '[CACHED] ' + json.response : '[MODEL] ' + json.response
      timeout: 65000

