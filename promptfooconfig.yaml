    assert: [{ type: starts-with, value: "[MODEL]" }]
  - vars: { prompt: "What are the steps to change my company login password?" }
    assert: [{ type: starts-with, value: "[CACHED]" }]

  - vars: { prompt: "What is the primary function of a reverse proxy server?" }
