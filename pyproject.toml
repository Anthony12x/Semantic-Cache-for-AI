[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-gateway"
version = "0.1.0"
description = "API Gateway with semantic caching for LLM inference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["semantic-cache", "llm", "fastapi", "redis", "vector-search"]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic-settings>=2.1.0",
    "onnxruntime>=1.16.3",
    "transformers>=4.35.2",
    "redis>=5.0.1",
    "numpy>=1.26.2",
    "aiohttp>=3.9.1",
    "huggingface-hub>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[project.scripts]
calibrate-thresholds = "scripts.calibrate_thresholds:run_parameter_sweep"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
